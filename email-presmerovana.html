<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Přihlášení</title>
</head>
<body>
    <h1>Prosím zadejte <br>své přihlašovací údaje do systému</h1>
    <form method="POST">
        <label for="firstname">Jméno</label>
        <input type="text" id="firstname" name="firstname"> <br><br>
        <label for="lastname">Přijmení</label>
        <input type="text" id="lastname" name="lastname" placeholder="Nová"> <br><br>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="jananova@gmail.com" required>
    </form>
</body>
</html>
